# 发布到 xiaofany.com：GitHub Release 人工发布后，把同一批文件发布到 xiaofany.com（R2 + 下载接口 + 应用内更新接口），
# GitHub Release 登记为备用线路。也可以手动运行，但只用于已经正式发布的 Release（草稿在 GitHub 上的下载地址是 404，
# 备用线路会失效），草稿一律拒绝。发布脚本 scripts/publish-xiaofany.mjs 拷自 xiaofany.com 仓库。
# 没有 Secret RELEASE_TOKEN 时（例如 fork）给出 notice 后跳过。流程见 docs/RELEASING.md。
name: Publish to xiaofany.com

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 要发布的 tag（如 v0.1.0），只能是已正式发布的 Release
        required: true

permissions:
  contents: read

concurrency:
  group: publish-xiaofany-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # 通过环境变量传入，不在脚本里直接展开 ${{ }}。
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      RELEASE_API: https://xiaofany.com
      RELEASE_SLUG: cliprecipe
    steps:
      - name: 检查 RELEASE_TOKEN
        id: token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::notice::没有设置 Secret RELEASE_TOKEN，跳过发布到 xiaofany.com。"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 检查 tag 与 Release 状态
        id: release
        if: steps.token.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::tag 必须是 v<版本号>：$TAG"
            exit 1
          fi
          # 状态和渠道一律从 GitHub 重新读取（手动运行时没有事件载荷）
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease > "$RUNNER_TEMP/release.json"
          if [ "$(jq -r .isDraft "$RUNNER_TEMP/release.json")" = "true" ]; then
            echo "::error::$TAG 还是草稿：请先在 GitHub 上发布 Release，发布后会自动运行本 workflow。"
            exit 1
          fi
          if [ "$(jq -r .isPrerelease "$RUNNER_TEMP/release.json")" = "true" ]; then
            echo "channel=beta" >> "$GITHUB_OUTPUT"
          else
            echo "channel=stable" >> "$GITHUB_OUTPUT"
          fi

      # 检出这个 tag：清单规则、发布脚本与 CHANGELOG 都以发布的那个提交为准
      - uses: actions/checkout@v7
        if: steps.token.outputs.enabled == 'true'
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        if: steps.token.outputs.enabled == 'true'
        with:
          node-version: 22

      - name: 下载 Release 上的文件
        if: steps.token.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/dist" --pattern 'ClipRecipe_*'
          ls -l "$RUNNER_TEMP/dist"

      - name: 生成发布清单
        if: steps.token.outputs.enabled == 'true'
        run: |
          node scripts/xiaofany-manifest.mjs --dir "$RUNNER_TEMP/dist" --tag "$TAG" \
            --upstream-base "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"

      - name: 发布
        if: steps.token.outputs.enabled == 'true'
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          CHANNEL: ${{ steps.release.outputs.channel }}
        run: |
          # 更新说明：CHANGELOG 里这个版本的小节（不带 Release 页面上的下载说明）
          node scripts/release.mjs update-notes "$TAG" > "$RUNNER_TEMP/notes.md"
          # 必须写成 --notes=…：说明通常以「- 」开头，分开写会被当成另一个选项。
          # --skip-existing：版本已发布时视为成功（重跑安全）；--force：覆盖上次中途失败留下的草稿。
          # 续传记录含预签名上传地址，放在工作区外，不上传为 artifact。
          node scripts/publish-xiaofany.mjs \
            --manifest "$RUNNER_TEMP/dist/xiaofany-release.json" \
            --channel "$CHANNEL" "--notes=$(cat "$RUNNER_TEMP/notes.md")" \
            --skip-existing --force \
            --state-file "$RUNNER_TEMP/xiaofany-release-state.json"

      # 发布后核对：版本接口的版本号；Tauri 升级接口对旧版本返回这个版本，签名与 Release 上的 .sig 一致，
      # 下载地址的文件名也对得上（接口有 60 秒缓存，重试几次）。
      - name: 核对
        if: steps.token.outputs.enabled == 'true'
        env:
          CHANNEL: ${{ steps.release.outputs.channel }}
        run: |
          version="${TAG#v}"
          query=""
          [ "$CHANNEL" = "beta" ] && query="?channel=beta"
          check() {
            latest="$(curl -fsS "$RELEASE_API/api/v1/products/$RELEASE_SLUG/latest$query" | jq -r .version)" || return 1
            [ "$latest" = "$version" ] || { echo "latest 接口返回 ${latest}，应为 $version"; return 1; }
            for target in windows/x86_64 linux/x86_64; do
              case "$target" in
                windows/x86_64) file="ClipRecipe_${version}_x64-setup.exe" ;;
                linux/x86_64) file="ClipRecipe_${version}_amd64.AppImage" ;;
              esac
              body="$RUNNER_TEMP/update.json"
              status="$(curl -sS -o "$body" -w '%{http_code}' "$RELEASE_API/api/update/$RELEASE_SLUG/tauri/$target/0.0.0$query")"
              [ "$status" = "200" ] || { echo "$target 返回 HTTP $status"; return 1; }
              got="$(jq -r .version "$body")"
              [ "$got" = "$version" ] || { echo "$target 返回版本 ${got}，应为 $version"; return 1; }
              expected="$(tr -d '\r\n' < "$RUNNER_TEMP/dist/$file.sig")"
              [ "$(jq -r '.signature // empty' "$body")" = "$expected" ] || { echo "$target 的签名与 $file.sig 不一致"; return 1; }
              name="$(jq -r '.url // empty' "$body" | sed 's/[?#].*//; s|.*/||')"
              [ "$name" = "$file" ] || { echo "$target 的下载地址指向 ${name}，应为 $file"; return 1; }
              echo "✓ $target → $got"
            done
            # macOS 的 dmg（实验性，Release 上有才核对）：website/install.sh 用的文件信息接口返回这个文件和它的 SHA-256
            for arch in arm64 x64; do
              file="ClipRecipe_${version}_macos_${arch}.dmg"
              [ -f "$RUNNER_TEMP/dist/$file" ] || continue
              info="$(curl -fsS "$RELEASE_API/api/v1/products/$RELEASE_SLUG/asset?platform=mac&arch=$arch&format=dmg&version=$version" | tr -d '\r')" \
                || { echo "mac $arch 的文件信息接口没有返回 $version"; return 1; }
              name="$(printf '%s\n' "$info" | sed -n 's/^name=//p' | head -n 1)"
              [ "$name" = "$file" ] || { echo "mac $arch 的文件信息接口返回 ${name}，应为 $file"; return 1; }
              expected="$(sha256sum "$RUNNER_TEMP/dist/$file" | awk '{print $1}')"
              got="$(printf '%s\n' "$info" | sed -n 's/^sha256=//p' | head -n 1 | tr 'A-F' 'a-f')"
              [ "$got" = "$expected" ] || { echo "mac $arch 的 SHA-256 与 $file 不一致"; return 1; }
              echo "✓ mac/$arch → $file"
            done
          }
          for attempt in 1 2 3 4 5 6; do
            if check; then
              echo "- xiaofany.com：\`$RELEASE_SLUG $version\`（${CHANNEL}），版本接口和应用内更新接口都已核对" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "第 $attempt 次核对未通过，30 秒后重试"
            sleep 30
          done
          echo "::error::发布后核对失败：xiaofany.com 的版本接口或应用内更新接口没有返回 $version"
          exit 1
