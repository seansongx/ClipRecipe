[package]
name = "cliprecipe"
version = "0.1.1"
description = "开源的视频批量处理桌面工具"
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "cliprecipe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
trash = "5"
tauri-plugin-opener = "2"
ureq = { version = "2", default-features = false, features = ["tls"] }
# 应用内下载 FFmpeg：校验 npm 包（tgz）的 SHA-256，只解出其中一个可执行文件
sha2 = "0.10"
flate2 = "1"
tar = { version = "0.4", default-features = false }
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
# 自动更新：读 GitHub Release 的 latest.json，下载并校验签名（minisign）后安装，见 docs/RELEASING.md
tauri-plugin-updater = "2.14"

[features]
# 只用于端到端测试（scripts/e2e-smoke.mjs 以 `--features e2e-hooks` 构建调试版）：允许用环境变量替换内嵌的
# FFmpeg 下载清单（本机假服务器）并隔离 FFmpeg 查找。只能用于调试构建（见 ffmpeg/managed.rs 的 compile_error!）。
e2e-hooks = []

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[target."cfg(windows)".dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }
windows-version = "0.1"

