[package]
name = "cliprecipe"
version = "0.1.0"
description = "开源的视频批量处理桌面工具"
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "cliprecipe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
trash = "5"
tauri-plugin-opener = "2"
ureq = { version = "2", default-features = false, features = ["tls"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
